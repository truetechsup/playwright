name: Playwright Tests

on:
  repository_dispatch:
    types: [run-tests]

jobs:
  run-tests:
    name: Run Playwright tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Get data from webhook
      run: |
        echo "ADAPTER_MODE=${{ github.event.client_payload.adapter_mode }}" >> $GITHUB_ENV
        echo "TMS_URL=${{ github.event.client_payload.url }}" >> $GITHUB_ENV
        echo "TEST_RUN_ID=${{ github.event.client_payload.test_run_id }}" >> $GITHUB_ENV
        echo "PROJECT_ID=${{ github.event.client_payload.project_id }}" >> $GITHUB_ENV
        echo "CONFIGURATION_IDS=${{ github.event.client_payload.configuration_id[0] }}" >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        if [ ! -f package.json ]; then
          npm init -y
        fi
        # Всегда ставим последнюю версию адаптера
        npm install @playwright/test testit-adapter-playwright@latest
        npx playwright install --with-deps

    - name: Set up Python (adapterMode=1)
      if: env.ADAPTER_MODE == '1'
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Setup Test IT filter (adapterMode=1)
      if: env.ADAPTER_MODE == '1'
      env:
        TMS_TOKEN: ${{ secrets.TMS_PRIVATE_TOKEN }}
      run: |
        # Всегда ставим последнюю версию testit-cli
        python -m pip install --upgrade pip testit-cli
        mkdir -p tmp
        testit autotests_filter \
          --url "${{ env.TMS_URL }}" \
          --configuration-id "${{ env.CONFIGURATION_IDS }}" \
          --testrun-id "${{ env.TEST_RUN_ID }}" \
          --framework playwright \
          --disable-cert-validation \
          --output tmp/filter.txt
        if [ ! -s tmp/filter.txt ]; then
          echo "empty" > tmp/filter.txt
        fi
        echo "Filter:"
        cat tmp/filter.txt

    - name: Download sync-storage
      run: |
        mkdir -p .caches
        # Получаем JSON последнего релиза
        RELEASE_JSON=$(curl -s "https://api.github.com/repos/testit-tms/sync-storage-public/releases/latest")
        LATEST_VERSION=$(echo "$RELEASE_JSON" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
        if [ -z "$LATEST_VERSION" ]; then
          echo "Failed to get latest version"
          exit 1
        fi
        echo "Latest sync-storage version: $LATEST_VERSION"
        # Ищем актив для linux_amd64
        DOWNLOAD_URL=$(echo "$RELEASE_JSON" | grep -o '"browser_download_url": "[^"]*linux_amd64"' | sed -E 's/.*"([^"]+)".*/\1/')
        if [ -z "$DOWNLOAD_URL" ]; then
          echo "Could not find linux_amd64 binary in release"
          exit 1
        fi
        curl -L -o .caches/syncstorage-linux-amd64 "$DOWNLOAD_URL"
        chmod +x .caches/syncstorage-linux-amd64
        # Проверка, что скачан реальный исполняемый файл
        file .caches/syncstorage-linux-amd64 | grep -q "ELF.*executable" || { echo "Downloaded file is not an executable"; cat .caches/syncstorage-linux-amd64 | head -c 200; exit 1; }

    - name: Start sync-storage
      run: |
        # adapterMode=1 — прогон из вебхука, передаём testRunId
        # adapterMode=2 — прогон создаёт адаптер, testRunId не передаём
        TEST_RUN_ARGS=()
        if [ "${{ env.ADAPTER_MODE }}" == "1" ]; then
          TEST_RUN_ARGS=(--testRunId ${{ env.TEST_RUN_ID }})
        fi
        # Если один результат завис "в процессе", sync-storage сам завершит его через 600 с,
        # чтобы wait-completion дождался применения всех результатов
        export TMS_SYNC_STORAGE_AUTOCOMPLETE_FALLBACK_S=600
        nohup .caches/syncstorage-linux-amd64 "${TEST_RUN_ARGS[@]}" \
          --port 49152 \
          --baseURL ${{ env.TMS_URL }} \
          --privateToken ${{ secrets.TMS_PRIVATE_TOKEN }} > service.log 2>&1 &
        echo $! > syncstorage.pid
        sleep 3

    - name: Run tests
      env:
        TMS_PRIVATE_TOKEN: ${{ secrets.TMS_PRIVATE_TOKEN }}
      run: |
        # adapterMode=1 — запускаются только тесты из существующего прогона (фильтр testit-cli)
        # adapterMode=2 — адаптер сам создаёт новый прогон, testRunId не передаём
        GREP_ARGS=()
        if [ "${{ env.ADAPTER_MODE }}" == "1" ]; then
          FILTER=$(cat tmp/filter.txt)
          if [ -z "$FILTER" ] || [ "$FILTER" = "empty" ]; then
            echo "No tests to run"
            exit 0
          fi
          GREP_ARGS=(--grep "$FILTER")
          export TMS_TEST_RUN_ID=${{ env.TEST_RUN_ID }}
        fi

        export TMS_SYNC_STORAGE_PORT=49152

        export TMS_TEST_RUN_LINKS=$(jq -nc \
          --arg runUrl "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          '[{url: $runUrl, title: "GitHub Actions pipeline", type: "Related"}]')

        export TMS_URL=${{ env.TMS_URL }}
        export TMS_PROJECT_ID=${{ env.PROJECT_ID }}
        export TMS_CONFIGURATION_ID=${{ env.CONFIGURATION_IDS }}
        export TMS_TEST_RUN_NAME="GitHub Actions #${{ github.run_number }} (adapterMode=${{ env.ADAPTER_MODE }})"
        export TMS_ADAPTER_MODE=${{ env.ADAPTER_MODE }}
        export TMS_CERT_VALIDATION=false
        export TMS_IMPORT_REALTIME=true

        npx playwright test "${GREP_ARGS[@]}"

    - name: Wait for sync-storage completion
      if: always()
      run: |
        # Ждём, пока sync-storage применит все результаты (включая зависший "в процессе"),
        # и только после этого останавливаем его
        curl -v http://127.0.0.1:49152/wait-completion || true
        if [ -f syncstorage.pid ]; then
          kill $(cat syncstorage.pid) || true
        fi

    - name: Upload sync-storage log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: syncstorage-log
        path: service.log
        retention-days: 1

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
